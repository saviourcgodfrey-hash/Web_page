<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    
    *{
      margin: 0px;
    }
    
    *body {
      background-color: rgb(12, 12, 12);
    }
    .food-container {
      border: 1px solid;
      border-radius: 32px;
      background-color: rgb(112, 214, 129);
      justify-content: center;
      display: flex;
      box-sizing: border-box;
      text-align: center;
    }

    .food-card {
      padding: 30px ;
      display: inline-block;
      padding-left: 1%;
      border-radius: 60%;
      box-sizing: border-box;
    }

    .Cart {
      color: rgb(34, 51, 199);
      background-color: rgb(112, 214, 129);
      border-color: rgb(82, 114, 95);
      border-radius: 10px;
      border-width: 4px;
      font-weight: bold;
      margin: 10px 0px 0px;
      padding: right 18px;
      padding-bottom: 10px;
      padding: 8px;
      box-shadow: 3px 3px 4px rgba(27, 27, 27, 0.5);
      cursor: pointer;
      transition: 0.5s;
      box-sizing: border-box;
    }

    .Cart::after {
      content: "🛒";
      margin-left: 5px;
    }
    .Cart:hover {
      color: rgb(112, 214, 129);
      background-color: rgb(34, 51, 199);
    }

    .Remaining {
      margin: 15px ;
      text-align: center;
      background-color: rgb(112, 214, 129);
      color: blanchedalmond;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      border-radius: 10px;
    }

    img {
      box-sizing: border-box;
      border-radius: 15px;
      min-height: 7.5rem;
      width: 9rem;
      margin: 2px;
      padding: 0px;
      border: 2px inset rgb(136, 120, 120);
    }
    nav {
      padding: 1px;
      padding-left: 5px;
      padding-right: 6px;
      font-family: monospace;
      font-size: x-large;
    }

    img:hover {
      opacity: 0.8;
      transition: 0.5s;
    }
  </style>
  <body>
    <nav><button style="background-color: red; border: none">X</button></nav>
    <div class="food-container">
      <div class="food-card">
        <h3>Chicken Burger</h3>
        <p><img src="/Web_project/assets/Background.jpg" /></p>
        <p title="₦6,500" style="font-family: fantasy; text-align: center">
          ₦6,500
        </p>
        <a href="/Web_project/chkbrg.html"
          ><button class="Cart">Add to Cart</button></a
        >
      </div>

      <div class="food-card">
        <h3>Chicken Pizza</h3>
        <p><img src="/Web_project/assets/farm.jpg" /></p>
        <p title="₦8000" style="font-family: fantasy; text-align: center">
          ₦8,000
        </p>
        <button class="Cart">Add to Cart</button>
      </div>

      <div class="food-card">
        <h3>Fried Rice</h3>
        <p><img src="/Web_project/assets/images.jpg" /></p>
        <p title="₦5,000" style="font-family: fantasy; text-align: center">
          ₦5,000
        </p>
        <button class="Cart">Add to Cart</button>
      </div>
    </div>

    <div>
      <div class="Remaining">
        <h1><p>Order Now</p></h1>
      </div>
    </div>
  </body>
  <script async scr="/Web_project/source.js"></script>
</html>
