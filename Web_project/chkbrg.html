<!DOCTYPE html>
<html>
<body>

<h2>Place Your Order</h2>

<form action="/submit-order" method="POST">

    <label for="food">Food:</label>
    <input
        type="text"
        id="food"
        name="food"
        aria-required="true"
        required
    >

    
    <br><br>

    <label for="quantity">Quantity:</label>
    <input
        type="number"
        id="quantity"
        name="quantity"
        aria-required="true"
        required
    >

    <br><br>

    <button type="submit">Place Order</button>

</form>

</body>
</html>
